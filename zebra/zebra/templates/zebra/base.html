<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}zebra{% endblock %}</title>
<style>
  :root { --fg:#1c1c1c; --muted:#6b7280; --line:#e5e7eb; --accent:#3b5bdb;
          --bg:#fafafa; --card:#fff; --bar:#e5e7eb; --barfill:#3b5bdb;
          --warn-bg:#fff4e5; --warn:#9a5b00; --ok-bg:#e7f6ec; --ok:#1a7f37;
          --atom-d:#10b981; --atom-l:#3b82f6; --atom-u:#8b5cf6; --atom-s:#f59e0b;
          --atom-x:#94a3b8; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
         color:var(--fg); background:var(--bg); }
  header { background:#111; color:#fff; padding:12px 20px;
           display:flex; align-items:baseline; gap:10px; }
  header a { color:#fff; text-decoration:none; font-weight:600; }
  header .spacer { flex:1; }
  header .nav { font-size:14px; font-weight:500; opacity:.85; }
  header .nav:hover { opacity:1; text-decoration:underline; }
  main { max-width:960px; margin:0 auto; padding:24px 20px 60px; }
  h1 { font-size:22px; margin:0 0 4px; }
  h2 { font-size:17px; margin:28px 0 10px; }
  a { color:var(--accent); }
  .muted { color:var(--muted); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px;
          padding:16px; margin-bottom:16px; }
  table { border-collapse:collapse; width:100%; }
  th,td { text-align:left; padding:6px 10px; border-bottom:1px solid var(--line);
          font-variant-numeric:tabular-nums; }
  th { color:var(--muted); font-weight:600; font-size:13px; }
  code { background:#f0f0f3; padding:1px 5px; border-radius:4px;
         font:13px ui-monospace,SFMono-Regular,Menlo,monospace; }
  .cmd { display:block; background:#0f172a; color:#e2e8f0; padding:12px;
         border-radius:8px; overflow-x:auto; white-space:pre; }
  .bar { background:var(--bar); border-radius:6px; height:20px; overflow:hidden; }
  .bar > span { display:block; height:100%; background:var(--barfill); }
  .btn { display:inline-block; background:var(--accent); color:#fff; border:0;
         padding:8px 14px; border-radius:8px; text-decoration:none; cursor:pointer;
         font-size:14px; }
  .btn.secondary { background:#e5e7eb; color:#111; }
  .btn.danger { background:#c0392b; color:#fff; }
  input[type=text], textarea, select { width:100%; padding:8px; border:1px solid var(--line);
         border-radius:8px; font:14px ui-monospace,monospace; }
  label { display:block; margin:12px 0 4px; font-weight:600; font-size:14px; }
  .pill { display:inline-block; padding:2px 8px; border-radius:999px; font-size:12px; }
  .warn { background:var(--warn-bg); color:var(--warn); }
  .ok { background:var(--ok-bg); color:var(--ok); }
  /* Run-status badges: one distinct hue per status (planned .. error). */
  .pill.status { text-transform:capitalize; font-weight:600; }
  .pill.st-planned   { background:#eef1f5; color:#475569; }  /* slate  */
  .pill.st-queued    { background:#e8eafd; color:#3b3fb5; }  /* indigo */
  .pill.st-running   { background:#e0f2fe; color:#0369a1;     /* sky    */
         animation:pulse-badge 1.6s ease-in-out infinite; }
  @keyframes pulse-badge { 0%,100% { opacity:1; } 50% { opacity:.5; } }
  @media (prefers-reduced-motion: reduce) { .pill.st-running { animation:none; } }
  .pill.st-exhausted { background:var(--ok-bg); color:var(--ok); }      /* green  */
  .pill.st-cracked   { background:#f3e8fd; color:#7c3aed; }  /* violet */
  .pill.st-aborted   { background:var(--warn-bg); color:var(--warn); }  /* amber  */
  .pill.st-error     { background:#fde8e8; color:#c0392b; }  /* red    */
  .note { padding:12px; border-radius:8px; margin:12px 0; }
  .combobox { position:relative; }
  .combobox-list { position:absolute; z-index:20; left:0; right:0; margin:2px 0 0;
         padding:4px; list-style:none; max-height:260px; overflow-y:auto;
         background:var(--card); border:1px solid var(--line); border-radius:8px;
         box-shadow:0 6px 20px rgba(0,0,0,.12); }
  .combobox-option { padding:6px 8px; border-radius:6px; cursor:pointer;
         font:14px ui-monospace,monospace; }
  .combobox-option.active, .combobox-option:hover { background:var(--accent); color:#fff; }
  .combobox-option.active .muted, .combobox-option:hover .muted { color:#dbe4ff; }
  .combobox-empty { padding:6px 8px; }
  .breadcrumb { font-size:13px; color:var(--muted); margin:0 0 18px; }
  .breadcrumb a { color:var(--muted); text-decoration:none; }
  .breadcrumb a:hover { color:var(--accent); text-decoration:underline; }
  .breadcrumb .sep { margin:0 8px; color:var(--line); }
  .breadcrumb .current { color:var(--fg); font-weight:600; }
  /* --- modal (recommender popup) --- */
  .modal-backdrop { position:fixed; inset:0; background:rgba(15,23,42,.45);
         display:flex; align-items:flex-start; justify-content:center;
         padding:40px 16px; z-index:50; overflow-y:auto; }
  .modal-backdrop[hidden] { display:none; }
  .modal { background:var(--card); border-radius:12px; width:100%; max-width:640px;
         box-shadow:0 20px 60px rgba(0,0,0,.3); padding:20px 22px 22px; }
  .modal-head { display:flex; align-items:baseline; justify-content:space-between; gap:12px; }
  .modal-head h3 { margin:0; font-size:18px; }
  .modal-close { background:none; border:0; font-size:22px; line-height:1;
         color:var(--muted); cursor:pointer; padding:0 4px; }
  .seg { display:flex; flex-wrap:wrap; gap:8px; margin:14px 0 4px; }
  .seg button { flex:1 1 auto; min-width:80px; padding:8px 10px; border:1px solid var(--line);
         border-radius:8px; background:var(--card); color:var(--fg); cursor:pointer; font-size:14px; }
  .seg button.active { background:var(--accent); color:#fff; border-color:var(--accent); }
  .reco { border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin:10px 0; }
  .reco.top { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset; }
  .reco-pattern { font:15px ui-monospace,SFMono-Regular,Menlo,monospace; font-weight:600; }
  .reco-meta { color:var(--muted); font-size:12.5px; margin:6px 0 10px; line-height:1.7; }
  .reco-meta b { color:var(--fg); font-weight:600; }
  .throbber { display:inline-block; width:1em; height:1em; border:2px solid rgba(255,255,255,.4);
         border-top-color:#fff; border-radius:50%; animation:spin .6s linear infinite;
         vertical-align:-2px; margin-right:6px; }
  @keyframes spin { to { transform:rotate(360deg); } }
  /* --- search-space visualization --- */
  .cov-toggle { background:none; border:0; cursor:pointer; font-size:14px;
         color:var(--muted); padding:0 4px; line-height:1; }
  tr.cov-detail > td { background:#fbfbfd; }
  .viz { padding:4px 2px 12px; }
  .viz h4 { margin:16px 0 6px; font-size:11px; color:var(--muted); font-weight:700;
         text-transform:uppercase; letter-spacing:.05em; }
  .viz svg { max-width:100%; height:auto; display:block; }
  .viz-tabs { display:flex; gap:6px; margin:6px 0 10px; }
  .viz-tab { font-size:12px; padding:4px 12px; border:1px solid var(--line);
         border-radius:999px; background:var(--card); color:var(--fg); cursor:pointer; }
  .viz-tab.active { background:var(--accent); color:#fff; border-color:var(--accent); }
  .viz .atom-d { fill:var(--atom-d); } .viz .atom-l { fill:var(--atom-l); }
  .viz .atom-u { fill:var(--atom-u); } .viz .atom-s { fill:var(--atom-s); }
  .viz .atom-x { fill:var(--atom-x); } .viz .atom-rest { fill:var(--line); }
  .viz .ribbon { stroke:none; } .viz .ribbon.hi { stroke:#111; stroke-width:.7; }
  .viz .dim { opacity:.12; }
  .viz-legend { display:flex; flex-wrap:wrap; gap:12px; font-size:12px;
         color:var(--muted); margin:6px 0; }
  .viz-legend i { display:inline-block; width:11px; height:11px; border-radius:3px;
         vertical-align:-1px; margin-right:4px; }
  .viz-summary { font-size:12.5px; color:var(--muted); margin-top:10px; line-height:1.7; }
  .viz-note { font-size:12.5px; color:var(--warn); background:var(--warn-bg);
         padding:8px 10px; border-radius:6px; margin:8px 0; }
  .viz-axislabel { font:11px system-ui; fill:var(--muted); }
  .viz-bandlabel { font:10px ui-monospace,SFMono-Regular,Menlo,monospace; fill:#fff; }
</style>
</head>
<body>

<header>
  <a href="{% url 'index' %}">🦓 zebra</a>
  <span class="muted">hashcat mask coverage</span>
  <span class="spacer"></span>
  <a class="nav" href="{% url 'queue' %}">☰ Queue</a>
  <a class="nav" href="{% url 'settings' %}">⚙ Settings</a>
</header>

<main>{% block breadcrumb %}{% endblock %}{% block content %}{% endblock %}</main>
<script>
// Attack-type toggle: show only the field groups whose data-modes contains the
// currently selected attack mode.
(function () {
  var sel = document.querySelector('[data-attack-select]');
  if (!sel) return;
  function sync() {
    var m = sel.value;
    document.querySelectorAll('[data-modes]').forEach(function (el) {
      el.hidden = el.getAttribute('data-modes').split(' ').indexOf(m) === -1;
    });
  }
  sel.addEventListener('change', sync);
  sync();
})();
</script>
<script>
// Searchable combobox: filter options by substring of name or module number,
// keep the chosen id in a hidden input. Progressive enhancement over a text field.
document.querySelectorAll('[data-combobox]').forEach(function (box) {
  var hidden = box.querySelector('input[type=hidden]');
  var input = box.querySelector('[data-combobox-input]');
  var list = box.querySelector('[data-combobox-list]');
  var empty = box.querySelector('[data-combobox-empty]');
  var options = Array.prototype.slice.call(list.querySelectorAll('.combobox-option'));
  var active = -1;

  function labelFor(val) {
    for (var i = 0; i < options.length; i++) {
      if (options[i].dataset.value === val) return options[i].dataset.label;
    }
    return '';
  }
  if (hidden.value) input.value = labelFor(hidden.value);

  function visible() { return options.filter(function (o) { return !o.hidden; }); }
  function filter() {
    var q = input.value.trim().toLowerCase();
    options.forEach(function (o) {
      o.hidden = q !== '' && o.dataset.search.indexOf(q) === -1;
    });
    if (empty) empty.hidden = visible().length !== 0;
    active = -1; highlight();
  }
  function open() { filter(); list.hidden = false; }
  function close() { list.hidden = true; active = -1; highlight(); }
  function highlight() {
    var vis = visible();
    options.forEach(function (o) { o.classList.remove('active'); });
    if (active >= 0 && active < vis.length) {
      vis[active].classList.add('active');
      vis[active].scrollIntoView({ block: 'nearest' });
    }
  }
  function choose(o) { hidden.value = o.dataset.value; input.value = o.dataset.label; close(); }

  input.addEventListener('focus', open);
  input.addEventListener('input', function () { hidden.value = ''; open(); });
  input.addEventListener('keydown', function (e) {
    var vis = visible();
    if (e.key === 'ArrowDown') { e.preventDefault(); active = Math.min(active + 1, vis.length - 1); highlight(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); active = Math.max(active - 1, 0); highlight(); }
    else if (e.key === 'Enter' && !list.hidden && active >= 0 && vis[active]) { e.preventDefault(); choose(vis[active]); }
    else if (e.key === 'Escape') { close(); }
  });
  options.forEach(function (o) {
    o.addEventListener('mousedown', function (e) { e.preventDefault(); choose(o); });
  });
  input.addEventListener('blur', function () {
    // Snap text back to the selected label (or clear) so it can't mismatch the id.
    setTimeout(function () { input.value = hidden.value ? labelFor(hidden.value) : ''; close(); }, 120);
  });
});
</script>
</body>
</html>
